<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club Universitario · Minibásquet · Categoría Mini · Donato</title>
  <meta name="description" content="Plantel de minibásquet (categoría Mini) del Club Universitario (equipo de Donato): jugadores, fotos y datos." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__content">
      <img class="hero__logo" src="img/club-universitario-logo.svg" alt="Escudo del Club Universitario de Córdoba" />
      <p class="hero__eyebrow">Club Universitario · Minibásquet</p>
      <h1 class="hero__title">Equipo de Donato</h1>
      <p class="hero__subtitle">Conocé al plantel: nombres, fotos y datos de cada jugador.</p>
      <p class="hero__category">Categoría Mini</p>
      <p class="hero__note">⚠ Datos e imágenes de ejemplo — se reemplazarán por los reales.</p>
    </div>
  </header>

  <main class="container">
    <section class="roster" id="roster" aria-label="Plantel del equipo">
      <!-- Las tarjetas se generan automáticamente desde players.js -->
    </section>
  </main>

  <footer class="footer">
    <p>Club Universitario · Minibásquet · Categoría Mini · Equipo de Donato · Página de ejemplo</p>
  </footer>

  <script src="players.js?v=2"></script>
  <script src="render.js?v=2"></script>
</body>
</html>
